<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kedi Hastanesi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="logo" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M4 4l3.5 4h9L20 4v9a8 8 0 0 1-16 0z"/><circle cx="9" cy="12.5" r="1.2"/><circle cx="15" cy="12.5" r="1.2"/></svg>
            </span>
            <div>
                <strong>Kedi Hastanesi</strong>
                <span>Merkez Klinik</span>
            </div>
        </div>
        <span id="bugun" class="today"></span>
    </header>

    <main>
        <section class="stats" aria-label="Özet">
            <div class="stat"><span>Kayıtlı hasta</span><strong id="statHasta">-</strong></div>
            <div class="stat"><span>Bugünkü randevu</span><strong id="statBugun">-</strong></div>
            <div class="stat"><span>Bekleyen</span><strong id="statBekleyen">-</strong></div>
            <div class="stat warn"><span>Kritik stok</span><strong id="statStok">-</strong></div>
        </section>

        <div class="grid">
            <!-- Hasta Listeleme Bölümü -->
            <section class="card patients">
                <div class="card-head">
                    <h2>Hastalar</h2>
                    <div class="tools">
                        <input type="search" id="arama" placeholder="İsim, tür ya da sahip ara" aria-label="Hasta ara">
                        <button type="button" class="primary" id="yeniHasta">Yeni hasta</button>
                    </div>
                </div>
                <table id="hastaTable">
                    <thead>
                        <tr>
                            <th>Hasta</th>
                            <th>Yaş</th>
                            <th>Cinsiyet</th>
                            <th>Sağlık durumu</th>
                            <th>Sahibi</th>
                            <th>Son ziyaret</th>
                            <th><span class="sr-only">İşlemler</span></th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Hastalar buraya yüklenecek -->
                    </tbody>
                </table>
                <p class="empty" id="bosListe" hidden>Bu aramaya uyan hasta yok.</p>
            </section>

            <aside class="side">
                <section class="card">
                    <div class="card-head"><h2>Bugünkü randevular</h2></div>
                    <ol class="appointments" id="randevular"></ol>
                </section>
                <section class="card">
                    <div class="card-head"><h2>Stok uyarıları</h2></div>
                    <ul class="stock" id="stok"></ul>
                </section>
            </aside>
        </div>
    </main>

    <!-- Hasta Ekleme ve Düzenleme Formu -->
    <dialog id="hastaDialog">
        <form id="hastaForm" method="dialog">
            <h2 id="formBaslik">Yeni hasta</h2>
            <div class="fields">
                <label>İsim<input type="text" name="isim" required maxlength="100"></label>
                <label>Tür<input type="text" name="tur" maxlength="50" placeholder="Örn. Tekir"></label>
                <label>Yaş<input type="number" name="yas" required min="0" max="30"></label>
                <label>Cinsiyet
                    <select name="cinsiyet">
                        <option value="Dişi">Dişi</option>
                        <option value="Erkek">Erkek</option>
                    </select>
                </label>
                <label class="wide">Sağlık durumu<input type="text" name="saglikDurumu"></label>
                <label class="wide">Sahip bilgileri<input type="text" name="sahipBilgileri"></label>
            </div>
            <p class="form-error" id="formHata" hidden></p>
            <div class="actions">
                <button type="button" class="ghost" data-close>Vazgeç</button>
                <button type="submit" class="primary">Kaydet</button>
            </div>
        </form>
    </dialog>

    <!-- Hasta Geçmişi -->
    <dialog id="detayDialog" class="drawer">
        <div class="drawer-head">
            <div>
                <h2 id="detayIsim"></h2>
                <p id="detayAlt"></p>
            </div>
            <button type="button" class="ghost" data-close aria-label="Kapat">Kapat</button>
        </div>
        <ol class="timeline" id="gecmis"></ol>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
</body>
</html>
