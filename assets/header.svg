      <animateMotion dur="2.2s" begin="0.8s" repeatCount="indefinite" path="M1060 114 C1060 140 890 120 860 150"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" begin="0.8s" repeatCount="indefinite"/>
    </circle><path d="M906 185 L1010 185" stroke="#30363D" stroke-width="2" fill="none"/><path d="M906 185 L1010 185" class="flow" stroke="#58A6FF" stroke-width="2" fill="none" style="animation-delay:1.0s"/><circle r="4" fill="#79C0FF" opacity="0">
      <animateMotion dur="2.2s" begin="1.6s" repeatCount="indefinite" path="M906 185 L1010 185"/>
