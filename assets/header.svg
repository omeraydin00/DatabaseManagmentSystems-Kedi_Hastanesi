    </circle><rect x="770" y="44" width="136" height="70" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/><rect x="770" y="70" width="136" height="1.5" fill="#30363D"/><text x="784" y="62" class="small" fill="#79C0FF" style="fill:#79C0FF">Patients</text><rect x="784" y="80" width="96" height="5" rx="2.5" fill="#30363D"/><rect x="784" y="91" width="76" height="5" rx="2.5" fill="#30363D"/><rect x="784" y="102" width="88" height="5" rx="2.5" fill="#30363D"/><rect x="1010" y="44" width="136" height="70" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/><rect x="1010" y="70" width="136" height="1.5" fill="#30363D"/><text x="1024" y="62" class="small" fill="#79C0FF" style="fill:#79C0FF">Appointments</text><rect x="1024" y="80" width="96" height="5" rx="2.5" fill="#30363D"/><rect x="1024" y="91" width="76" height="5" rx="2.5" fill="#30363D"/><rect x="1024" y="102" width="88" height="5" rx="2.5" fill="#30363D"/><rect x="770" y="150" width="136" height="70" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/><rect x="770" y="176" width="136" height="1.5" fill="#30363D"/><text x="784" y="168" class="small" fill="#79C0FF" style="fill:#79C0FF">Treatments</text><rect x="784" y="186" width="96" height="5" rx="2.5" fill="#30363D"/><rect x="784" y="197" width="76" height="5" rx="2.5" fill="#30363D"/><rect x="784" y="208" width="88" height="5" rx="2.5" fill="#30363D"/><rect x="1010" y="150" width="136" height="70" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/><rect x="1010" y="176" width="136" height="1.5" fill="#30363D"/><text x="1024" y="168" class="small" fill="#79C0FF" style="fill:#79C0FF">Inventory</text><rect x="1024" y="186" width="96" height="5" rx="2.5" fill="#30363D"/><rect x="1024" y="197" width="76" height="5" rx="2.5" fill="#30363D"/><rect x="1024" y="208" width="88" height="5" rx="2.5" fill="#30363D"/><rect x="776" y="77" width="124" height="11" rx="3" fill="#58A6FF" opacity="0.15"><animate attributeName="y" values="77;77;88;